<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6f2">
    <title>You’re offline · travelAI</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7f6f2; color: #1c2a35; font-family: Arial, sans-serif; text-align: center; }
      main { width: min(100%, 420px); padding: 38px 28px; border: 1px solid #e8e2d8; border-radius: 22px; background: #fffefa; box-shadow: 0 18px 56px #172a3512; }
      .mark { display: grid; width: 52px; height: 52px; place-items: center; margin: 0 auto 22px; border-radius: 50%; background: #172a35; color: #f0bf77; font-size: 24px; }
      h1 { margin: 0; font: 500 34px/1.08 Georgia, serif; }
      p { margin: 14px 0 0; color: #69747a; font-size: 15px; line-height: 1.65; }
      button { min-height: 48px; margin-top: 24px; padding: 0 22px; border: 0; border-radius: 999px; background: #263b47; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #bd884c; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">✦</span>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to plan a trip and open your saved itinerary. Your private travel data is never stored for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
